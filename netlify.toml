[build]
  publish = "."

# Redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://secvisiontech.netlify.app/*"
  to = "https://www.secvisiontech.com/:splat"
  status = 301
  force = true
# #678 — daily demand automation: every 10 minutes 00:00–04:50 UTC (05:30–10:20 IST);
# the function starts today's run at the configured IST hour and advances it one slice per tick.
[functions."auto-pipeline-cron"]
  schedule = "*/5 0-4 * * *"
